name: gymfolio
description: "GymFolio — a training log that decides whether you earned the next week."
publish_to: 'none'

# The version here is the source of truth for the in-app updater. Bump it in the
# same commit as the tag: a v-tag whose pubspec disagrees will offer an update
# to a version the phone already has.
version: 0.4.0+4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  share_plus: ^10.1.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  wakelock_plus: ^1.2.10
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Regenerate the source art with `python tool/make_icon.py`, then run
# `dart run flutter_launcher_icons` — tool/prepare_android.sh does both, after
# android/ exists. Check assets/icon/_launcher_preview.png, not icon.png: the
# adaptive mask crops, and a mark that looks right full-bleed can lose its
# plates to the circle.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E1113"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/programs/
    - assets/sound/

  # Barlow and Barlow Condensed, SIL Open Font License (assets/fonts/OFL.txt).
  # Bundled rather than fetched at runtime: the app has to look the same in a
  # basement gym with no signal.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
